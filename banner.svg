<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="30%" style="stop-color:#0a0a2e"/>
      <stop offset="60%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="50%" style="stop-color:#00b0ff"/>
      <stop offset="100%" style="stop-color:#00e5ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0066"/>
      <stop offset="50%" style="stop-color:#ff0099"/>
      <stop offset="100%" style="stop-color:#ff0066"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#aa00ff"/>
      <stop offset="50%" style="stop-color:#d500f9"/>
      <stop offset="100%" style="stop-color:#aa00ff"/>
    </linearGradient>
    <linearGradient id="energyBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00e5ff;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#d500f9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff0066;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="explosionCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="30%" style="stop-color:#00e5ff;stop-opacity:0.6"/>
      <stop offset="60%" style="stop-color:#d500f9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff0066;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowHuge">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Space Background -->
  <rect width="960" height="340" fill="url(#bgGrad)"/>

  <!-- Animated Stars -->
  <g fill="#ffffff">
    <circle cx="50" cy="30" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="80" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="280" cy="20" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="400" cy="60" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="550" cy="30" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="680" cy="70" r="0.9" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="800" cy="25" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.3s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="900" cy="55" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="100" cy="250" r="1" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.1s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="350" cy="280" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.7s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="600" cy="260" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" begin="1.3s"/></circle>
    <circle cx="850" cy="290" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite" begin="0.6s"/></circle>
  </g>

  <!-- Matrix Rain Columns -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#00ff41" opacity="0.12">
    <text x="30" y="20">01</text><text x="30" y="35">10</text><text x="30" y="50">01</text><text x="30" y="65">11</text><text x="30" y="80">00</text><text x="30" y="95">10</text><text x="30" y="110">01</text>
    <text x="90" y="20">11</text><text x="90" y="35">00</text><text x="90" y="50">10</text><text x="90" y="65">01</text><text x="90" y="80">11</text><text x="90" y="95">00</text><text x="90" y="110">10</text>
    <text x="150" y="20">10</text><text x="150" y="35">01</text><text x="150" y="50">11</text><text x="150" y="65">00</text><text x="150" y="80">10</text><text x="150" y="95">01</text><text x="150" y="110">11</text>
    <text x="810" y="20">01</text><text x="810" y="35">10</text><text x="810" y="50">01</text><text x="810" y="65">11</text><text x="810" y="80">00</text><text x="810" y="95">10</text><text x="810" y="110">01</text>
    <text x="870" y="20">11</text><text x="870" y="35">00</text><text x="870" y="50">10</text><text x="870" y="65">01</text><text x="870" y="80">11</text><text x="870" y="95">00</text><text x="870" y="110">10</text>
    <text x="930" y="20">10</text><text x="930" y="35">01</text><text x="930" y="50">11</text><text x="930" y="65">00</text><text x="930" y="80">10</text><text x="930" y="95">01</text><text x="930" y="110">11</text>
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Horizontal Scan Line -->
  <rect width="960" height="1.5" fill="#00e5ff" opacity="0.06">
    <animate attributeName="y" values="0;340;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Glitch Horizontal Bars -->
  <g opacity="0.04">
    <rect x="0" y="45" width="960" height="2" fill="#00e5ff"><animate attributeName="opacity" values="0;0.15;0" dur="3s" repeatCount="indefinite" begin="0s"/></rect>
    <rect x="0" y="120" width="960" height="1.5" fill="#ff0066"><animate attributeName="opacity" values="0;0.12;0" dur="3.5s" repeatCount="indefinite" begin="1.2s"/></rect>
    <rect x="0" y="200" width="960" height="2" fill="#d500f9"><animate attributeName="opacity" values="0;0.1;0" dur="4s" repeatCount="indefinite" begin="2.5s"/></rect>
    <rect x="0" y="280" width="960" height="1.5" fill="#00e5ff"><animate attributeName="opacity" values="0;0.12;0" dur="3.2s" repeatCount="indefinite" begin="0.8s"/></rect>
  </g>

  <!-- Circuit Board Lines - Left -->
  <g stroke="#00e5ff" stroke-width="0.7" fill="none" opacity="0.15">
    <path d="M 0,100 L 40,100 L 50,90 L 80,90">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 0,140 L 30,140 L 40,150 L 70,150">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M 0,200 L 50,200 L 60,190 L 90,190">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="2.8s" repeatCount="indefinite" begin="1s"/>
    </path>
    <circle cx="80" cy="90" r="2.5" fill="#00e5ff"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="150" r="2.5" fill="#00e5ff"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="90" cy="190" r="2.5" fill="#00e5ff"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
  </g>

  <!-- Circuit Board Lines - Right -->
  <g stroke="#ff0066" stroke-width="0.7" fill="none" opacity="0.15">
    <path d="M 960,100 L 920,100 L 910,90 L 880,90">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M 960,160 L 930,160 L 920,170 L 890,170">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M 960,220 L 910,220 L 900,210 L 870,210">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="2.9s" repeatCount="indefinite" begin="1.3s"/>
    </path>
    <circle cx="880" cy="90" r="2.5" fill="#ff0066"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="890" cy="170" r="2.5" fill="#ff0066"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="870" cy="210" r="2.5" fill="#ff0066"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="1.3s"/></circle>
  </g>

  <!-- Central Energy Orb -->
  <circle cx="480" cy="140" r="40" fill="url(#explosionCenter)" filter="url(#glowHuge)">
    <animate attributeName="r" values="35;50;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="140" r="20" fill="none" stroke="#00e5ff" stroke-width="1" filter="url(#glowBig)">
    <animate attributeName="r" values="15;30;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating Rings Around Center -->
  <g transform="translate(480,140)" fill="none" stroke-width="0.8">
    <ellipse rx="60" ry="25" stroke="#00e5ff" opacity="0.2" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="55" ry="30" stroke="#d500f9" opacity="0.2" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" begin="1s"/>
    </ellipse>
    <ellipse rx="70" ry="20" stroke="#ff0066" opacity="0.15" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="5s" repeatCount="indefinite" begin="2s"/>
    </ellipse>
  </g>

  <!-- Main Title with Glitch Effect -->
  <g filter="url(#glowBig)">
    <!-- Shadow/ghost text for glitch -->
    <text x="483" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#ff0066" opacity="0.3">
      &gt; HACKER_DEV
      <animate attributeName="x" values="483;477;483;486;483" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0;0.3;0" dur="3s" repeatCount="indefinite"/>
    </text>
    <!-- Main text -->
    <text x="480" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="url(#neonCyan)">
      &gt; HACKER_DEV
      <animate attributeName="opacity" values="1;0.85;1" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Subtitle with fade in/out -->
  <g filter="url(#glow)">
    <text x="480" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#00e5ff" letter-spacing="3">
      [ SYSTEM INITIALIZED... WELCOME TO THE GRID ]
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Energy Beams from Center -->
  <g stroke="url(#energyBeam)" stroke-width="2" filter="url(#glowBig)">
    <line x1="480" y1="140" x2="100" y2="100" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="480" y1="140" x2="860" y2="100" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="480" y1="140" x2="200" y2="250" opacity="0.2">
      <animate attributeName="opacity" values="0.05;0.35;0.05" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="480" y1="140" x2="760" y2="250" opacity="0.2">
      <animate attributeName="opacity" values="0.05;0.35;0.05" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
    </line>
  </g>

  <!-- Floating Energy Particles -->
  <g filter="url(#glow)">
    <circle cx="200" cy="100" r="2" fill="#00e5ff">
      <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="100" r="2" fill="#ff0066">
      <animate attributeName="cy" values="100;80;100" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="350" cy="220" r="1.5" fill="#d500f9">
      <animate attributeName="cy" values="220;200;220" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="610" cy="220" r="1.5" fill="#00e5ff">
      <animate attributeName="cy" values="220;200;220" dur="3.8s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="480" cy="80" r="2.5" fill="#d500f9">
      <animate attributeName="cy" values="80;60;80" dur="3.2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>

  <!-- Katana Slash Effects -->
  <g stroke="#00e5ff" stroke-width="2.5" fill="none" filter="url(#glowBig)" stroke-linecap="round">
    <path d="M 60,280 Q 80,260 120,255" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </path>
    <path d="M 840,280 Q 860,260 900,255" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
    </path>
  </g>
  <g stroke="#ff0066" stroke-width="1.5" fill="none" filter="url(#glow)" stroke-linecap="round">
    <path d="M 130,290 Q 160,270 200,268" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
    </path>
    <path d="M 760,290 Q 790,270 830,268" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="1.8s" repeatCount="indefinite" begin="1.2s"/>
    </path>
  </g>

  <!-- Bottom HUD Bar -->
  <rect x="0" y="300" width="960" height="40" fill="#050510" opacity="0.8"/>
  <line x1="0" y1="300" x2="960" y2="300" stroke="#00e5ff" stroke-width="0.5" opacity="0.3"/>
  <g font-family="'Courier New', monospace" font-size="11" filter="url(#glow)">
    <text x="25" y="322" fill="#00e5ff">
      STATUS: ONLINE
      <animate attributeName="fill" values="#00e5ff;#00ff41;#00e5ff" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="322" text-anchor="middle" fill="#d500f9">
      ▓▓▓▓▓▓▓▓▓▓ LOADING SKILLS 100% ▓▓▓▓▓▓▓▓▓▓
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="935" y="322" text-anchor="end" fill="#ff0066">
      MODE: HACKER
      <animate attributeName="fill" values="#ff0066;#d500f9;#ff0066" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.4">
    <polyline points="10,30 10,8 32,8"/>
    <polyline points="928,8 950,8 950,30"/>
    <polyline points="950,310 950,332 928,332"/>
    <polyline points="32,332 10,332 10,310"/>
  </g>
</svg>
