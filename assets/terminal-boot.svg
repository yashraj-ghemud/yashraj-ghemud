<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="260" rx="14" fill="#0a0a0a" stroke="#00ff41" stroke-width="2"/>

  <!-- terminal top bar -->
  <circle cx="30" cy="30" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="30" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="7" fill="#27c93f"/>
  <text x="450" y="35" text-anchor="middle" font-family="monospace" font-size="13" fill="#555">viczo@core: ~/ai_systems</text>
  <line x1="0" y1="50" x2="900" y2="50" stroke="#00ff41" stroke-width="1" opacity="0.4"/>

  <!-- boot lines, loop period = 6s -->
  <g font-family="monospace" font-size="17" fill="#00ff41">
    <text x="35" y="85">
      $ ./initialize_ai_core.sh
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.1;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="118">
      &gt; loading kotlin_modules ................ [OK]
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.25;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="151">
      &gt; compiling jetpack_compose_ui ........... [OK]
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.40;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="184">
      &gt; connecting groq_api // gemini_api ...... [OK]
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.55;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="220" font-weight="bold" font-size="20" fill="#ff003c">
      &gt;&gt;&gt; SYSTEM READY — VICZO ONLINE &lt;&lt;&lt;
      <animate attributeName="opacity" values="0;0;1;0;1;1" keyTimes="0;0.65;0.68;0.70;0.72;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <!-- blinking cursor -->
    <rect x="35" y="228" width="11" height="16" fill="#00ff41">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- IMPACT / EXPLOSION burst when SYSTEM READY hits -->
  <circle cx="450" cy="210" r="0" fill="none" stroke="#ff003c" stroke-width="5">
    <animate attributeName="r" values="0;0;140" keyTimes="0;0.68;0.78" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.68;0.70;0.80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="210" r="0" fill="none" stroke="#00fff9" stroke-width="3">
    <animate attributeName="r" values="0;0;90" keyTimes="0;0.68;0.76" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.68;0.70;0.78" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
