# 🐍 Snake Contribution Graph - GitHub Actions Workflow
# This workflow generates the snake animation on your contribution graph
# Place this file at: .github/workflows/snake.yml

name: Generate Snake

on:
  # Run every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main (for initial setup)
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate the snake SVGs
      - name: Generate Snake Game from GitHub Contribution Graph 🐍
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?palette=github-dark&color-snake=00f0ff
            dist/github-snake-dark.gif?palette=github-dark&color-snake=ff0080

      # Show the status of the build
      - name: Show Build Status 📊
        run: |
          echo "🐍 Snake animation generated successfully!"
          echo "📁 Files created in dist/ directory"
          ls -la dist/

      # Push the generated files to the output branch
      - name: Push to output branch 🚀
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
