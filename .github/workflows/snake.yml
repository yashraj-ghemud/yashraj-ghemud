# 🐍 Snake Contribution Graph - GitHub Actions Workflow
# FIXED: Removed GIF outputs that caused "Cannot find module 'canvas'" error
# The svg-only action does NOT support GIF generation
# Place this file at: .github/workflows/snake.yml

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  
  workflow_dispatch:
  
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate ONLY SVG outputs (no GIF - canvas module not available)
      - name: Generate Snake Game from GitHub Contribution Graph 🐍
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Show Build Status 📊
        run: |
          echo "🐍 Snake SVG generated successfully!"
          ls -la dist/

      # Push the generated files to the output branch
      - name: Push to output branch 🚀
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
